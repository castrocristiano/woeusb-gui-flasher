# ==============================================================================
# SonarQube Community Server Configuration
# ==============================================================================

sonar.projectKey=woeusb-gui-flasher
sonar.projectName=woeusb-gui-flasher
sonar.projectVersion=0.1.0

# Paths
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/__pycache__/**, **/*.pyc, **/.venv/**
sonar.coverage.exclusions=tests/**, **/__init__.py

# Language & Reports
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
