app-id: org.woeusb.WoeUsbGui
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: woeusb-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host:ro
  - --filesystem=/run/media:rw
  - --system-talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: wimlib
    buildsystem: autotools
    config-opts:
      - --without-fuse
      - --without-ntfs-3g
    sources:
      - type: archive
        url: https://wimlib.net/downloads/wimlib-1.14.5.tar.gz
        sha256: 84221a3abd5b91228f15f8e6065c335a336237b5738197b75bf419eea561a194

  - name: p7zip
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS 7z
      - make install DEST_DIR=/app DEST_BIN=/app/bin DEST_SHARE=/app/lib/p7zip DEST_MAN=/app/share/man
    sources:
      - type: archive
        url: https://github.com/p7zip-project/p7zip/archive/v17.05.tar.gz
        sha256: d2788f892571058c08d27095c22154579dfefb807ebe357d145ab2ddddefb1a6

  - name: woeusb-gui
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 assets/org.woeusb.WoeUsbGui.desktop /app/share/applications/org.woeusb.WoeUsbGui.desktop
      - install -Dm644 assets/org.woeusb.WoeUsbGui.svg /app/share/icons/hicolor/scalable/apps/org.woeusb.WoeUsbGui.svg
      - install -Dm644 assets/org.woeusb.WoeUsbGui.metainfo.xml /app/share/metainfo/org.woeusb.WoeUsbGui.metainfo.xml
    sources:
      - type: dir
        path: .

